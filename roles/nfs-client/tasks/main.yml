---
- name: Install NFS client
  ansible.builtin.apt:
    name: "{{ nfs_client_package }}"
    state: present
    update_cache: true
  become: true

- name: Create NFS mount directories
  ansible.builtin.file:
    path: "{{ item.mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nfs_mounts }}"
  become: true

- name: Configure NFS mounts
  ansible.posix.mount:
    path: "{{ item.mountpoint }}"
    src: "{{ item.server }}:{{ item.export }}"
    fstype: nfs4
    opts: "_netdev,nofail,x-systemd.automount,x-systemd.idle-timeout=0"
    state: present
  loop: "{{ nfs_mounts }}"
  become: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Determine automount unit names
  ansible.builtin.command:
    cmd: "systemd-escape --path --suffix=automount {{ item.mountpoint }}"
  loop: "{{ nfs_mounts }}"
  register: nfs_automount_units
  changed_when: false
  become: true

- name: Enable NFS automount units
  ansible.builtin.systemd_service:
    name: "{{ item.stdout }}"
    enabled: true
    state: started
  loop: "{{ nfs_automount_units.results }}"
  become: true
