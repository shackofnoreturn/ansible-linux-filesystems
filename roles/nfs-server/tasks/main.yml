---
- name: Install NFS server
  ansible.builtin.apt:
    name: "{{ nfs_server_package }}"
    state: present
    update_cache: true
  become: true

- name: Stop NFS server before validating storage
  ansible.builtin.systemd_service:
    name: nfs-server
    state: stopped
  become: true

- name: Require storage mount paths when exports are configured
  ansible.builtin.assert:
    that:
      - nfs_exports | length == 0 or nfs_storage_mounts | length > 0
    fail_msg: >-
      Configure nfs_storage_mounts with the mounted storage roots before
      configuring NFS exports.

- name: Check NFS storage paths are mounted
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ item }}"
  loop: "{{ nfs_storage_mounts }}"
  register: nfs_storage_mount_status
  changed_when: false
  failed_when: false
  become: true

- name: Stop NFS server when export storage is unavailable
  ansible.builtin.systemd_service:
    name: nfs-server
    state: stopped
  when:
    - nfs_storage_mount_status.results
        | selectattr('rc', 'ne', 0)
        | list
        | length > 0
  become: true

- name: Refuse to configure exports for unmounted filesystems
  ansible.builtin.fail:
    msg: >-
      NFS storage path {{ item.item }} is not mounted.
      Refusing to configure exports.
      Is the JBOD/storage online?
  loop: "{{ nfs_storage_mount_status.results }}"
  when: item.rc != 0

- name: Configure NFS exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports
  become: true

- name: Configure NFS storage recovery script
  ansible.builtin.template:
    src: nfs-storage-recovery.sh.j2
    dest: /usr/local/sbin/nfs-storage-recovery
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Configure NFS storage recovery service
  ansible.builtin.template:
    src: nfs-storage-recovery.service.j2
    dest: /etc/systemd/system/nfs-storage-recovery.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
  become: true

- name: Configure NFS storage recovery timer
  ansible.builtin.template:
    src: nfs-storage-recovery.timer.j2
    dest: /etc/systemd/system/nfs-storage-recovery.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
  become: true

- name: Ensure NFS server is enabled
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: true
  when:
    - nfs_storage_mount_status.results
        | selectattr('rc', 'equalto', 0)
        | list
        | length == nfs_storage_mount_status.results | length
  become: true

- name: Enable NFS storage recovery timer
  ansible.builtin.systemd_service:
    name: nfs-storage-recovery.timer
    enabled: true
    state: started
  become: true
